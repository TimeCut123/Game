<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Echoes</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ECHOES — every orb you grab summons your past self, retracing your exact path.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Layout ----------
let W = 960, H = 640, scale = 1, offX = 0, offY = 0, dpr = 1;
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  scale = Math.min(innerWidth / W, (innerHeight - 50) / H) * 0.96;
  offX = (innerWidth - W * scale) / 2;
  offY = 50 + (innerHeight - 50 - H * scale) / 2;
}
function pickArena() {
  if (innerHeight > innerWidth * 1.15) { W = 600; H = 900; } else { W = 960; H = 640; }
  layout();
}
addEventListener('resize', layout);
pickArena();

// ---------- Constants & state ----------
const R = 11, SPEED = 250, STEP = 1 / 60, GRACE = 50, SHATTER_R = 170;
let state = 'menu', tick = 0, hx = [], hy = [], player, echoes = [], orb, shard;
let score = 0, orbs = 0, grazes = 0, particles = [], floaters = [], rings = [];
let shake = 0, deathInfo = null, deadAt = 0, t = 0, muted = false;
let best = 0;
try { best = +localStorage.getItem('echoes.best') || 0; } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);

function spawnPoint(minFromPlayer) {
  let bestP = null, bestScore = -1;
  for (let i = 0; i < 60; i++) {
    const x = 40 + Math.random() * (W - 80), y = 40 + Math.random() * (H - 80);
    let s = Math.min(dist(x, y, player.x, player.y) / minFromPlayer, 1.5);
    for (const e of echoes) s = Math.min(s, dist(x, y, e.x, e.y) / 70);
    if (s > bestScore) { bestScore = s; bestP = { x, y }; }
    if (s >= 1) break;
  }
  return bestP;
}

function reset() {
  pickArena();
  tick = 0; hx = []; hy = [];
  player = { x: W / 2, y: H / 2 };
  echoes = []; particles = []; floaters = []; rings = [];
  score = 0; orbs = 0; grazes = 0; shake = 0; shard = null; deathInfo = null;
  orb = spawnPoint(260);
  state = 'play';
  tone(330, 0.15, 'triangle', 0.06, 200);
}
function start() {
  if (state === 'pause') state = 'play';
  else reset();
}

// ---------- Audio ----------
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, type = 'sine', v = 0.08, slide = 0) {
  if (!actx || muted) return;
  const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, now);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), now + d);
  g.gain.setValueAtTime(v, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g).connect(actx.destination);
  o.start(now); o.stop(now + d + 0.02);
}
const SCALE_NOTES = [0, 2, 4, 7, 9];
function noteFor(n) { return 262 * Math.pow(2, (SCALE_NOTES[n % 5] + 12 * (Math.floor(n / 5) % 3)) / 12); }

// ---------- Input ----------
const keys = {};
let stick = null;
addEventListener('keydown', e => {
  ensureAudio();
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'dead' && performance.now() - deadAt < 500) return;
    if (state !== 'play') start();
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play';
  }
  if (e.code === 'KeyM') muted = !muted;
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (state !== 'play') {
    if (state === 'dead' && performance.now() - deadAt < 700) return;
    start();
  }
  stick = { ax: e.clientX, ay: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (stick && e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; } });
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; };
cv.addEventListener('pointerup', endStick);
cv.addEventListener('pointercancel', endStick);
const autoPause = () => { if (state === 'play') state = 'pause'; stick = null; for (const k in keys) keys[k] = false; };
addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

// ---------- Simulation (fixed 60 Hz so echoes replay exactly) ----------
function step() {
  let dx = 0, dy = 0, vx = 0, vy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  const m = Math.hypot(dx, dy);
  if (m > 0) { vx = dx / m * SPEED; vy = dy / m * SPEED; }
  else if (stick) {
    const sx = stick.x - stick.ax, sy = stick.y - stick.ay, d = Math.hypot(sx, sy);
    if (d > 4) { const k = Math.min(d / 45, 1) * SPEED / d; vx = sx * k; vy = sy * k; }
  }
  player.x = clamp(player.x + vx * STEP, R, W - R);
  player.y = clamp(player.y + vy * STEP, R, H - R);
  hx.push(player.x); hy.push(player.y);

  for (const e of echoes) {
    const i = tick - e.delay;
    e.x = hx[i]; e.y = hy[i];
    if (e.gcd > 0) e.gcd--;
    if (tick - e.born < GRACE) continue;
    const d = dist(e.x, e.y, player.x, player.y);
    if (d < R * 1.7) { die(e); return; }
    if (d < R * 2 + 18 && e.gcd <= 0) {
      e.gcd = 60; grazes++; score += 2;
      floaters.push({ x: player.x, y: player.y - 18, txt: 'close! +2', life: 0.9, col: '#9ff' });
      tone(1400, 0.06, 'square', 0.03);
    }
  }

  if (dist(orb.x, orb.y, player.x, player.y) < R + 11) collectOrb();
  if (shard) {
    shard.life -= STEP;
    if (shard.life <= 0) shard = null;
    else if (dist(shard.x, shard.y, player.x, player.y) < R + 13) collectShard();
  }
}

function collectOrb() {
  orbs++; score += 10;
  const hue = (190 + orbs * 47) % 360;
  echoes.push({ delay: tick, born: tick, hue, x: hx[0], y: hy[0], gcd: 0 });
  burst(orb.x, orb.y, 18, '#ffd76a', 180);
  rings.push({ x: hx[0], y: hy[0], r: 0, max: 60, col: `hsl(${hue},90%,65%)` });
  floaters.push({ x: orb.x, y: orb.y - 16, txt: '+10', life: 0.8, col: '#ffd76a' });
  tone(noteFor(orbs), 0.18, 'triangle', 0.09);
  setTimeout(() => tone(110, 0.35, 'sine', 0.07, -40), 60);
  orb = spawnPoint(220);
  if (orbs % 5 === 0 && !shard) { const p = spawnPoint(180); shard = { x: p.x, y: p.y, life: 8 }; }
}

function collectShard() {
  let n = 0;
  echoes = echoes.filter(e => {
    if (dist(e.x, e.y, player.x, player.y) < SHATTER_R) {
      n++; burst(e.x, e.y, 22, `hsl(${e.hue},90%,65%)`, 240);
      return false;
    }
    return true;
  });
  score += n * 5;
  rings.push({ x: player.x, y: player.y, r: 0, max: SHATTER_R, col: '#c58bff' });
  floaters.push({ x: player.x, y: player.y - 22, txt: n ? `shattered ${n}! +${n * 5}` : 'shatter!', life: 1.2, col: '#d7b0ff' });
  tone(880, 0.4, 'sawtooth', 0.05, -700);
  shake = 8; shard = null;
}

function die(e) {
  state = 'dead'; deadAt = performance.now();
  deathInfo = { ago: (e.delay / 60).toFixed(1), hue: e.hue, time: (tick / 60).toFixed(1) };
  burst(player.x, player.y, 60, '#7ff', 320);
  burst(player.x, player.y, 30, `hsl(${e.hue},90%,65%)`, 260);
  shake = 20; stick = null;
  tone(440, 0.8, 'sawtooth', 0.08, -380);
  if (score > best) { best = score; deathInfo.newBest = true; try { localStorage.setItem('echoes.best', best); } catch (err) {} }
}

function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, max: 1, col, size: 1.5 + Math.random() * 2.5 });
  }
}

// ---------- Rendering ----------
function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function path(from, to) {
  ctx.beginPath();
  ctx.moveTo(hx[from], hy[from]);
  for (let i = from + 1; i <= to; i++) ctx.lineTo(hx[i], hy[i]);
  ctx.stroke();
}

function drawArena() {
  ctx.fillStyle = '#0c0f1d'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(140,160,255,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 40; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 40; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(140,160,255,0.35)'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);
}

function drawGame() {
  const now = hx.length - 1;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // Your past: the road your echoes will walk
  if (echoes.length) {
    let s = now;
    for (const e of echoes) s = Math.min(s, tick - e.delay);
    ctx.strokeStyle = 'rgba(130,150,255,0.08)'; ctx.lineWidth = 2;
    path(Math.max(0, s), now);
  }
  // Where each echo is heading next (1 second ahead)
  for (const e of echoes) {
    const i = Math.max(0, tick - 1 - e.delay);
    ctx.strokeStyle = `hsla(${e.hue},90%,65%,0.28)`; ctx.lineWidth = 4;
    ctx.setLineDash([2, 8]);
    path(i, Math.min(now, i + 60));
    ctx.setLineDash([]);
  }

  // Orb
  const pulse = 1 + Math.sin(t * 6) * 0.12;
  circle(orb.x, orb.y, 22 * pulse, 'rgba(255,215,106,0.12)');
  circle(orb.x, orb.y, 9 * pulse, '#ffd76a');
  ctx.strokeStyle = 'rgba(255,215,106,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(orb.x, orb.y, 15, t * 3, t * 3 + 4); ctx.stroke();

  // Shatter shard
  if (shard) {
    const blink = shard.life < 2 && Math.floor(t * 8) % 2 === 0;
    if (!blink) {
      ctx.save(); ctx.translate(shard.x, shard.y); ctx.rotate(t * 2);
      circle(0, 0, 26, 'rgba(197,139,255,0.14)');
      ctx.fillStyle = '#c58bff';
      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(10, 0); ctx.lineTo(0, 13); ctx.lineTo(-10, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(197,139,255,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(shard.x, shard.y, 20, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * shard.life / 8); ctx.stroke();
    }
  }

  // Echoes
  for (const e of echoes) {
    const i = tick - 1 - e.delay;
    if (i < 0) continue;
    const arming = tick - e.born < GRACE;
    for (let k = 12; k >= 1; k -= 2) {
      const j = i - k;
      if (j >= 0) circle(hx[j], hy[j], R * (1 - k / 16), `hsla(${e.hue},90%,60%,${0.25 * (1 - k / 13)})`);
    }
    const a = arming ? 0.25 + 0.25 * Math.sin(t * 30) : 1;
    circle(e.x, e.y, R * 2.1, `hsla(${e.hue},90%,60%,${0.15 * a})`);
    circle(e.x, e.y, R, `hsla(${e.hue},90%,62%,${0.85 * a})`);
    circle(e.x, e.y, R * 0.45, `hsla(${e.hue},100%,88%,${a})`);
  }

  // Player
  if (state !== 'dead') {
    for (let k = 14; k >= 1; k -= 2) {
      const j = now - k;
      if (j >= 0) circle(hx[j], hy[j], R * (1 - k / 18), `rgba(120,255,255,${0.3 * (1 - k / 15)})`);
    }
    circle(player.x, player.y, R * 2.2, 'rgba(120,255,255,0.13)');
    circle(player.x, player.y, R, '#6ff6ff');
    circle(player.x, player.y, R * 0.45, '#ffffff');
  }
}

let demo = [];
for (let i = 0; i < 6; i++) demo.push({ hue: (190 + i * 47) % 360, ph: i * 1.1 });
function drawDemo() {
  for (const d of demo) {
    for (let k = 20; k >= 0; k -= 2) {
      const tt = t * 0.6 + d.ph - k * 0.02;
      const x = W / 2 + Math.sin(tt * 1.3) * W * 0.38, y = H / 2 + Math.sin(tt * 1.9 + d.ph) * H * 0.36;
      circle(x, y, k === 0 ? R : R * (1 - k / 24), `hsla(${d.hue},90%,62%,${k === 0 ? 0.8 : 0.2 * (1 - k / 22)})`);
    }
  }
}

function drawFx(dt) {
  for (const r of rings) {
    r.r += dt * r.max * 3;
    ctx.strokeStyle = r.col; ctx.globalAlpha = Math.max(0, 1 - r.r / r.max); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  rings = rings.filter(r => r.r < r.max);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life);
    circle(p.x, p.y, p.size, p.col);
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
  ctx.textAlign = 'center'; ctx.font = `bold ${15 / scale}px system-ui, sans-serif`;
  for (const f of floaters) {
    f.life -= dt; f.y -= dt * 40;
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 2));
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  floaters = floaters.filter(f => f.life > 0);
}

function text(str, x, y, size, col, weight = '600') {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

// Clawd: a little pixel crab who dances on the menu and game-over screens
const CLAWD = [
  '.XXXXXXXXX.',
  '.XXEXXXEXX.',
  '.XXXXXXXXX.',
  '.XXXXXXXXX.',
  '.XXXXXXXXX.',
];
function drawClawd(x, y, px) {
  const beat = t * 4, b = Math.floor(beat) % 2, hop = Math.abs(Math.sin(beat * Math.PI)) * px * 2.5;
  ctx.save();
  ctx.translate(x, y - hop);
  ctx.rotate(Math.sin(beat * Math.PI / 2) * 0.18);
  ctx.translate(-5.5 * px, -3.5 * px);
  CLAWD.forEach((row, r) => [...row].forEach((c, k) => {
    if (c === '.') return;
    ctx.fillStyle = c === 'E' ? '#1a1a1a' : '#d97757';
    ctx.fillRect(k * px, r * px, px + 0.5, px + 0.5);
  }));
  ctx.fillStyle = '#d97757';
  // Arms wave in turn
  ctx.fillRect(0, (b ? 0 : 2) * px, px, px * 2);
  ctx.fillRect(10 * px, (b ? 2 : 0) * px, px, px * 2);
  // Legs step in turn
  [2, 4, 6, 8].forEach((k, i) => ctx.fillRect(k * px, 5 * px, px, px * ((i + b) % 2 ? 1 : 2)));
  ctx.restore();
  // Music notes
  ctx.textAlign = 'center';
  for (let i = 0; i < 2; i++) {
    const ph = (t * 0.8 + i * 0.5) % 1, side = i ? 1 : -1;
    ctx.globalAlpha = 1 - ph;
    text(i ? '\u266B' : '\u266A', x + side * (px * 8 + ph * px * 3), y - px * 3 - ph * px * 8, px * 4, '#ffd76a', '700');
  }
  ctx.globalAlpha = 1;
}

function drawUI() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min(1, innerWidth / 560), cx = innerWidth / 2, cy = offY + H * scale / 2;

  if (state !== 'menu') {
    ctx.textAlign = 'left';
    text(`${score}`, 16, 34, 26, '#fff', '800');
    text(`echoes ${echoes.length}`, 16 + ctx.measureText(`${score}`).width + 26, 32, 14, 'rgba(200,210,255,0.7)');
    ctx.textAlign = 'right';
    text(`best ${best}`, innerWidth - 16, 32, 14, 'rgba(200,210,255,0.7)');
  }

  if (stick && state === 'play') {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ax, stick.ay, 45, 0, Math.PI * 2); ctx.stroke();
    const dx = stick.x - stick.ax, dy = stick.y - stick.ay, d = Math.hypot(dx, dy), k = d > 45 ? 45 / d : 1;
    circle(stick.ax + dx * k, stick.ay + dy * k, 16, 'rgba(255,255,255,0.18)');
  }

  if (state === 'play') return;
  ctx.fillStyle = 'rgba(5,6,14,0.72)';
  ctx.fillRect(offX, offY, W * scale, H * scale);
  ctx.textAlign = 'center';
  const tap = matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Press Space or click';

  if (state === 'menu') {
    text('ECHOES', cx, cy - 110 * s, 72 * s, '#6ff6ff', '900');
    const lines = [
      'Every orb you grab summons an echo of you.',
      'It retraces your exact path, from the very start.',
      "Don't touch your past.",
    ];
    lines.forEach((l, i) => text(l, cx, cy - 40 * s + i * 30 * s, 18 * s, i === 2 ? '#ffd76a' : '#dfe4ff', i === 2 ? '700' : '500'));
    text('Purple shards shatter nearby echoes. Skim past echoes for bonus points.', cx, cy + 70 * s, 14 * s, 'rgba(210,215,255,0.65)', '400');
    text('Move: WASD / arrows, or drag anywhere', cx, cy + 96 * s, 14 * s, 'rgba(210,215,255,0.65)', '400');
    if (Math.floor(t * 2) % 2 === 0) text(`${tap} to begin`, cx, cy + 150 * s, 20 * s, '#fff', '700');
    drawClawd(cx, cy + 220 * s, 7 * s);
  } else if (state === 'pause') {
    text('PAUSED', cx, cy - 10, 48 * s, '#fff', '900');
    text(`${tap} to resume`, cx, cy + 36 * s, 18 * s, '#dfe4ff', '500');
  } else if (state === 'dead') {
    text('CAUGHT', cx, cy - 100 * s, 60 * s, `hsl(${deathInfo.hue},90%,65%)`, '900');
    text(`by yourself from ${deathInfo.ago}s ago`, cx, cy - 58 * s, 19 * s, '#dfe4ff', '500');
    text(`${score}`, cx, cy + 10 * s, 56 * s, '#fff', '900');
    text(deathInfo.newBest ? 'NEW BEST!' : `best ${best}`, cx, cy + 42 * s, 16 * s, deathInfo.newBest ? '#ffd76a' : 'rgba(210,215,255,0.7)', '700');
    text(`${orbs} orbs · ${grazes} close calls · ${deathInfo.time}s survived`, cx, cy + 78 * s, 15 * s, 'rgba(210,215,255,0.7)', '400');
    if (performance.now() - deadAt > 700 && Math.floor(t * 2) % 2 === 0) text(`${tap} to try again`, cx, cy + 130 * s, 20 * s, '#fff', '700');
    if (deathInfo.newBest) drawClawd(cx, cy + 195 * s, 6 * s);
  }
}

// ---------- Main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; t += dt;
  if (state === 'play') {
    acc += dt;
    while (acc >= STEP && state === 'play') { step(); tick++; acc -= STEP; }
  } else acc = 0;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#07080f'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; shake *= 0.9; if (shake < 0.3) shake = 0; }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx), dpr * (offY + sy));
  drawArena();
  if (state === 'menu') drawDemo(); else drawGame();
  drawFx(dt);
  drawUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
